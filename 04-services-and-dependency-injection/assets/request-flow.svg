<svg viewBox="0 0 640 160" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="160" fill="#ffffff"/>
  <rect x="10" y="55" width="110" height="50" rx="8" fill="none" stroke="#333" stroke-width="2"/>
  <text x="65" y="85" text-anchor="middle" font-size="12" fill="#333">HTTP Request</text>

  <line x1="120" y1="80" x2="175" y2="80" stroke="#333" stroke-width="2" marker-end="url(#m1)"/>

  <rect x="180" y="55" width="120" height="50" rx="8" fill="none" stroke="#333" stroke-width="2"/>
  <text x="240" y="85" text-anchor="middle" font-size="12" fill="#333">Controller</text>

  <line x1="300" y1="80" x2="355" y2="80" stroke="#333" stroke-width="2" marker-end="url(#m1)"/>

  <rect x="360" y="55" width="120" height="50" rx="8" fill="none" stroke="#333" stroke-width="2"/>
  <text x="420" y="85" text-anchor="middle" font-size="12" fill="#333">Service</text>

  <line x1="480" y1="80" x2="535" y2="80" stroke="#333" stroke-width="2" marker-end="url(#m1)"/>

  <rect x="540" y="55" width="90" height="50" rx="8" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="585" y="85" text-anchor="middle" font-size="12" fill="#888">Data</text>

  <text x="320" y="140" text-anchor="middle" font-size="10" fill="#a33">Nest injects the Service into the Controller's constructor — you never call "new"</text>

  <defs>
    <marker id="m1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#333"/>
    </marker>
  </defs>
</svg>
